# MinIO stores objects under /data in the container.
#
# hostPath maps to Windows Explorer path:
#   D:\LapTrinh\TableTennisShop\infra\data\minio
# Keep this separate from infra/data/mongo-* so Mongo dirs are not inside MinIO's backend root
# (otherwise MinIO lists them as bogus buckets).
#
# Docker Desktop for Windows exposes host folders under /run/desktop/mnt/host/<drive>/...
# On Linux/minikube/kind, change hostPath.path to a Linux path on that node.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      volumes:
        - name: minio-storage
          hostPath:
            path: /run/desktop/mnt/host/d/LapTrinh/TableTennisShop/infra/data/minio
            type: DirectoryOrCreate

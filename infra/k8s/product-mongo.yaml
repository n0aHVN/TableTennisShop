apiVersion: v1
kind: Service
metadata:
  name: product-mongo-service
spec:
  selector:
    app: product-mongo
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017

apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-mongo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-mongo
  template:
    metadata:
      labels:
        app: product-mongo
    spec:
      containers:
        - name: product-mongo
          image: mongo:8.0.10-rc0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: product-mongo-persistent-storage
              mountPath: /data/db
      volumes:
        - name: product-mongo-persistent-storage
          emptyDir: {}

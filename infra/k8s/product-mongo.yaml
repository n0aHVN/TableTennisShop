# MongoDB data under /data/db -> Windows: D:\LapTrinh\TableTennisShop\infra\data\mongo-product
# Docker Desktop: /run/desktop/mnt/host/d/... (adjust on Linux/minikube).

apiVersion: v1
kind: Service
metadata:
  name: product-mongo-service
spec:
  selector:
    app: product-mongo
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-mongo-deployment
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: product-mongo
  template:
    metadata:
      labels:
        app: product-mongo
    spec:
      containers:
        - name: product-mongo
          image: mongo:8.0.10-rc0
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --wiredTigerCacheSizeGB
            - "0.25"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: product-mongo-persistent-storage
              mountPath: /data/db
      volumes:
        - name: product-mongo-persistent-storage
          hostPath:
            path: /run/desktop/mnt/host/d/LapTrinh/TableTennisShop/infra/data/mongo-product
            type: DirectoryOrCreate

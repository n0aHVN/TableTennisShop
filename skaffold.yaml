apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: TableTennisShop
# All app services use port 3000 in-cluster; localPort must differ per service.
portForward:
  - resourceType: service
    resourceName: client-service
    port: 3000
    localPort: 3000
  - resourceType: service
    resourceName: auth-service
    port: 3000
    localPort: 3001
  - resourceType: service
    resourceName: product-service
    port: 3000
    localPort: 3002
  - resourceType: service
    resourceName: order-service
    port: 3000
    localPort: 3003
  - resourceType: service
    resourceName: inventory-service
    port: 3000
    localPort: 3004
  - resourceType: service
    resourceName: payment-service
    port: 3000
    localPort: 3005
  - resourceType: service
    resourceName: expiration-service
    port: 3000
    localPort: 3006
  - resourceType: service
    resourceName: config-service
    port: 3000
    localPort: 3007
  - resourceType: service
    resourceName: expiration-redis-svc
    port: 6379
    localPort: 6379
  - resourceType: service
    resourceName: minio-srv
    port: 9000
    localPort: 9000
  - resourceType: service
    resourceName: minio-srv
    port: 9001
    localPort: 9001
build:
  local:
    push: false
    concurrency: 1
  artifacts:
  # Auth (context: repo root so file:../common resolves in the image)
    - image: nguyennoah/auth-ttshop
      context: .
      docker:
        dockerfile: auth/Dockerfile
  # Product
    - image: nguyennoah/product-ttshop
      context: .
      docker:
        dockerfile: product/Dockerfile
  #Payment
    - image: nguyennoah/payment-ttshop
      context: .
      docker:
        dockerfile: payment/Dockerfile
  #Order
    - image: nguyennoah/order-ttshop
      context: .
      docker:
        dockerfile: order/Dockerfile
  #Inventory
    - image: nguyennoah/inventory-ttshop
      context: .
      docker:
        dockerfile: inventory/Dockerfile
  #Expiration
    - image: nguyennoah/expiration-ttshop
      context: .
      docker:
        dockerfile: expiration/Dockerfile
  # Config (landing / CMS-style settings)
    - image: nguyennoah/config-ttshop
      context: .
      docker:
        dockerfile: config/Dockerfile
  #Client
    - image: nguyennoah/client-ttshop
      context: client
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - infra/k8s/nats-depl.yaml
    - infra/k8s/nats-clusterIP.yaml
    - infra/k8s/*.yaml
deploy:
  kubectl:
    hooks:
      before:
        - host:
            command: ["docker", "pull", "mongo:8.0.10-rc0"]
        - host:
            command: ["docker", "pull", "redis:6.0.3-alpine"]
        - host:
            command: ["docker", "pull", "docker.io/library/nats-streaming:0.17.0"]
        - host:
            command: ["docker", "pull", "minio/minio"]
        # Admission webhook refuses Ingress until the controller is Ready
        - host:
            command:
              [
                "kubectl",
                "wait",
                "--namespace=ingress-nginx",
                "--for=condition=ready",
                "pod",
                "--selector=app.kubernetes.io/component=controller",
                "--timeout=180s",
              ]
  statusCheckDeadlineSeconds: 600

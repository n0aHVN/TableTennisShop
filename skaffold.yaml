apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: TableTennisShop
build:
  artifacts:
  # Auth
    - image: nguyennoah/auth-ttshop
      context: auth
      docker:
        dockerfile: Dockerfile
    - image: nguyennoah/product-ttshop
      context: product
      docker:
        dockerfile: Dockerfile
  #Cart
    - image: nguyennoah/cart-ttshop
      context: cart
      docker:
        dockerfile: Dockerfile
  #Order
    - image: nguyennoah/order-ttshop
      context: order
      docker:
        dockerfile: Dockerfile
  # Seeder
    - image: nguyennoah/seed-ttshop
      context: seed
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - infra/k8s/*
